[project]
name = "web-defacement-monitor-backend"
version = "0.1.0"
description = "FastAPI backend for the website defacement monitoring prototype"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = "^(data|\\.venv|\\.pytest_cache|\\.ruff_cache|\\.mypy_cache|\\.pytest-tmp)(/|\\\\)"
