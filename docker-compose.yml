# Local dev environment. Requires backend/.env and frontend/.env
# (copy from the .env.example in each folder) before running `docker compose up`.
services:
  backend:
    image: mcr.microsoft.com/playwright/python:v1.48.0-noble
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --reload"
    volumes:
      - ./backend:/app
    ipc: host
    security_opt:
      - seccomp:unconfined
    ports:
      - "8000:8000"
    environment:
      - BROWSER_DISABLE_SANDBOX=true
    env_file:
      - ./backend/.env

  frontend:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "3030:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
